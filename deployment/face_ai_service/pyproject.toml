[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ff-face-ai-service"
version = "0.1.3"
description = "Private, fail-closed biometric verification service for Flous Flow Odoo"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]
pilot = ["opencv-contrib-python-headless>=4.10,<5", "numpy>=1.26,<3", "cryptography>=43,<48"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ff_face_ai_service*"]
